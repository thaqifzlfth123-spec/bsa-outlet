<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSA Outlet — Sign In</title>
    <meta name="description" content="Sign in to BSA Outlet.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=11">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            font-family: 'Outfit', sans-serif;
        }
        @media (max-width: 991px) { body { overflow: auto; height: auto; } }

        /* ---- LEFT PANEL ---- */
        .panel-left {
            width: 55%;
            position: relative;
            overflow: hidden;
            background: #0f172a;
        }
        @media (max-width: 991px) { .panel-left { display: none; } }

        .panel-left img.bg-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.55;
            display: block;
        }

        .panel-left-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10,15,30,0.85) 0%, rgba(10,15,30,0.1) 60%);
        }

        .panel-left-content {
            position: absolute;
            bottom: 52px;
            left: 52px;
            right: 52px;
        }

        .brand-tag {
            display: inline-block;
            background: rgba(251,191,36,0.15);
            border: 1px solid rgba(251,191,36,0.4);
            color: #fbbf24;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 2px;
            margin-bottom: 18px;
            font-weight: 500;
        }

        .panel-left-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.6rem;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .panel-left-content p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.7;
            max-width: 380px;
            font-weight: 300;
        }

        /* ---- RIGHT PANEL ---- */
        .panel-right {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 64px;
            background: #fff;
            overflow-y: auto;
        }
        @media (max-width: 991px) {
            .panel-right {
                width: 100%;
                padding: 50px 28px;
            }
        }

        .right-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 48px;
            letter-spacing: 0.5px;
        }
        .right-logo span { color: #fbbf24; }

        .right-heading {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            font-family: 'Outfit', sans-serif;
        }
        .right-sub {
            font-size: 0.88rem;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        /* Toggle */
        .type-toggle {
            display: flex;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 28px;
        }
        .type-toggle input[type="radio"] { display: none; }
        .toggle-label {
            flex: 1;
            text-align: center;
            padding: 11px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            background: #f8fafc;
            border: none;
            display: block;
            transition: background 0.2s ease, color 0.2s ease;
            user-select: none;
        }
        .toggle-label.active {
            background: #0f172a;
            color: #ffffff;
        }

        /* Inputs */
        .field-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 7px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .field-input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
            font-family: 'Outfit', sans-serif;
        }
        .field-input:focus {
            border-color: #fbbf24;
            background: #fff;
        }
        .field-input::placeholder { color: #cbd5e1; }

        .field-group { margin-bottom: 20px; }

        /* Meta row */
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 0.82rem;
        }
        .meta-row label { color: #64748b; cursor: pointer; display: flex; align-items: center; gap: 7px; }
        .meta-row input[type="checkbox"] { accent-color: #0f172a; width: 13px; height: 13px; }
        .meta-row a { color: #0f172a; font-weight: 600; text-decoration: none; border-bottom: 1px solid #e2e8f0; padding-bottom: 1px; transition: border-color 0.2s; }
        .meta-row a:hover { border-color: #fbbf24; }

        /* Submit */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #0f172a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            font-family: 'Outfit', sans-serif;
        }
        .btn-submit:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }
        .btn-submit:active { transform: translateY(0); }

        /* Register */
        .reg-link {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
        .reg-link a {
            color: #0f172a;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1.5px solid #fbbf24;
            padding-bottom: 1px;
        }
        .reg-link a:hover { color: #fbbf24; }
    </style>
</head>
<body>

    <!-- LEFT PANEL -->
    <div class="panel-left">
        <img class="bg-photo" src="images/general/hero_bg.png" alt="BSA Outlet">
        <div class="panel-left-overlay"></div>
        <div class="panel-left-content">
            <h1>Dress well.<br>Live well.</h1>
            <p>Contemporary fashion for every occasion — menswear, womenswear, kids and footwear, all under one roof.</p>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel-right">

        <div class="right-logo">BSA <span>Outlet</span></div>

        <h2 class="right-heading" id="signinHeading">Sign in as Customer</h2>
        <p class="right-sub">Enter your credentials to continue.</p>

        <!-- Customer / Staff toggle -->
        <div class="type-toggle">
            <input type="radio" name="userType" id="customer" checked>
            <span class="toggle-label active" onclick="selectType('customer')">Customer</span>
            <input type="radio" name="userType" id="staff">
            <span class="toggle-label" onclick="selectType('staff')">Staff</span>
        </div>

        <!-- Form -->
        <form id="loginForm">
            <div class="field-group">
                <label class="field-label" for="loginEmail">Email</label>
                <input class="field-input" type="email" id="loginEmail" placeholder="your@email.com" required>
            </div>
            <div class="field-group">
                <label class="field-label" for="loginPassword">Password</label>
                <input class="field-input" type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <div class="meta-row">
                <label>
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn-submit">Sign in</button>
        </form>

        <div class="reg-link">
            New here? <a href="register.html">Create an account</a>
        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js?v=11"></script>
<script>
    function selectType(type) {
        document.getElementById('customer').checked = (type === 'customer');
        document.getElementById('staff').checked = (type === 'staff');
        document.querySelectorAll('.toggle-label').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        
        const heading = document.getElementById('signinHeading');
        if (heading) {
            heading.innerText = type === 'customer' ? 'Sign in as Customer' : 'Sign in as Staff';
        }
    }
</script>
</body>
</html>
