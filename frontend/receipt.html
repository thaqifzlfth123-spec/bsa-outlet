<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSA Outlet - Order Receipt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="home.html">BSA Outlet</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="home.html">Return to Shop</a></li>
        </ul>
    </div>
</nav>

<section class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 p-5 text-center" style="border-radius: 20px;">
                <h1 class="text-success mb-3" style="font-size: 4rem;">&#10004;</h1>
                <h2 class="fw-bold mb-4">Payment Successful!</h2>
                <p class="text-muted mb-4">Thank you for your purchase. Your order has been placed successfully.</p>
                
                <div class="bg-light p-4 rounded mb-4 text-start">
                    <h4>Receipt Details</h4>
                    <hr>
                    <p class="mb-1"><strong>Order ID:</strong> <span id="receiptOrderId">#---</span></p>
                    <p class="mb-1"><strong>Total Amount:</strong> <span id="receiptTotal">RM 0.00</span></p>
                    <p class="mb-1"><strong>Status:</strong> Pending Approval</p>
                </div>
                
                <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                    <button class="btn btn-outline-primary px-4" onclick="window.print()">Download Receipt</button>
                    <button class="btn btn-warning px-4" data-bs-toggle="modal" data-bs-target="#feedbackModal">Give Feedback</button>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Feedback Modal -->
<div class="modal fade" id="feedbackModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Leave Feedback</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="feedbackForm">
          <div class="mb-3">
            <label class="form-label text-muted">How was your experience?</label>
            <textarea class="form-control" id="feedbackMessage" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-warning w-100">Submit Feedback</button>
        </form>
      </div>
    </div>
  </div>
</div>

<footer class="footer mt-auto">
    <p>© 2026 BSA Outlet. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js?v=7"></script>
</body>
</html>
