<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSA Outlet - Employee Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="employee_home.html">BSA Outlet Employee</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="employee_home.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="order_details.html">Orders</a></li>
                <li class="nav-item"><a class="nav-link" href="stock_details.html">Stock</a></li>
                <li class="nav-item"><a class="nav-link" href="feedback_details.html">Feedback</a></li>
                <li class="nav-item"><a class="nav-link" href="membership_details.html">Memberships</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="hero-section text-center py-5">
    <div class="container mt-4">
        <h1 class="display-4 fw-bold mb-3">Welcome, <span id="empNameSpan">Employee</span></h1>
        
        <div class="row mt-4">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0 p-4 bg-primary text-white h-100 rounded-3">
                    <h4>Total Sales</h4>
                    <h2 id="totalSalesVal" class="mt-2">RM 0.00</h2>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0 p-4 bg-success text-white h-100 rounded-3">
                    <h4>Orders Today</h4>
                    <h2 id="ordersTodayVal" class="mt-2">0</h2>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0 p-4 bg-warning text-dark h-100 rounded-3">
                    <h4>Total Customers</h4>
                    <h2 id="totalCustomersVal" class="mt-2">0</h2>
                </div>
            </div>
        </div>

        <div class="row mt-4 justify-content-center">
            <div class="col-lg-12 text-start mb-2">
                <div id="lowStockAlerts"></div>
            </div>
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm border-0 p-4 rounded-3">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="text-dark mb-0">Best Selling Products</h4>
                        <select id="analyticsFilter" class="form-select w-auto">
                            <option value="all">All Time</option>
                            <option value="today">Today</option>
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                        </select>
                    </div>
                    <canvas id="salesChart" style="max-height: 300px;"></canvas>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="footer mt-auto py-3 text-center bg-light">
    <p class="mb-0">© 2026 BSA Outlet. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/script.js?v=9"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (!user || user.type !== 'staff') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('empNameSpan').textContent = user.name;
        }
    });
</script>
</body>
</html>
